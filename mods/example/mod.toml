[manifest]
id = "conker_example_mod"
version = "1.0.0"
display_name = "Multiplayer Characters"
description = "Unlocks every multiplayer character the cheat codes unlock: Caveman, Conker, Neo Conker, the Sergeant and Tediz Leader, the Weasel henchmen, the Zombies and Villagers, and Gregg."
short_description = "Unlocks the multiplayer characters."
authors = ["Conker recomp contributors"]
game_id = "conker"
minimum_recomp_version = "0.0.0"

[inputs]
elf_path = "build/mod.elf"
mod_filename = "conker_example_mod"
func_reference_syms_file = "../../config/us.syms.toml"
data_reference_syms_files = ["../../config/us.data.syms.toml"]
