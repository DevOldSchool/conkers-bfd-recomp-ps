# N64Recomp configuration for Conker's Bad Fur Day (US, NFUE, SHA-1 4cbadd3c4e0729dec46af64ad018050eada4f47a).
#
# Run from the repository root:
#   build/N64Recomp/N64Recomp config/us.toml
#
# `us.syms.toml` and the virtual ROM are generated by tools/gen_syms.py from the decomp
# inventory. Sections are described at their runtime (TLB) addresses: main at 0x10001000,
# game overlay at 0x15000000, debugger overlay at 0x16000000. See docs/memory-layout.md.

[input]
# No `entrypoint`: N64Recomp would recompile the handwritten boot stub at ROM 0x1000, which
# only clears bss, sets $sp and jumps to the TLB setup routine. The runtime's native entry
# function performs that work itself and then calls func_80001050, the first C function.
symbols_file_path = "us.syms.toml"
rom_file_path = "../build/us/conker.us.recomp.bin"
output_func_path = "../build/us/RecompiledFuncs"
functions_per_output_file = 50
# Declarations for the runtime-provided functions that funcs.h does not declare (see
# tools/gen_extras_decl.py and src/ultra_extras.cpp).
recomp_include = "#include \"recomp.h\"\n#include \"conker_extras_decl.h\"\n#include \"trace.h\""
# Emit TRACE_ENTRY()/TRACE_RETURN() in every function; src/trace.h turns them into a per-thread
# ring buffer of recent calls that the crash reporter prints (compile with -DCONKER_TRACE=1).
trace_mode = true

[patches]
# Functions that must not be recompiled because they touch CP0, the TLB or the exception
# vector. The runtime (N64ModernRuntime) provides the OS layer natively.
ignored = [
    # Rare's raw PI DMA for small transfers: polls PI_STATUS and programs the PI registers
    # directly (src/main/init_4470.c). Replaced by a native ROM copy in src/ultra_extras.cpp.
    "func_8000480C",
]

# Functions compiled to empty bodies (a `return` with no effect on state).
stubs = [
    # Handwritten CP0/TLB routines: boot TLB alias install (0x5AB0), demand-paging allocator setup (0x5B04),
    # TLB-miss page loader (0x5C2C), TLB index invalidation (0x61F8) and the debugger's TLB helper.
    # The runtime keeps the whole game image resident, so there is nothing to page.
    "func_80005AB0",
    "func_80005B04",
    "func_80005C2C",
    "func_800061F8",
    # Page-pool bitmap initialiser: walks the bitmap that func_80005B04 would have allocated.
    "func_80005BE0",
    "func_16003650",
    # Exception/interrupt handling family (0x71D0:0x8120): reads CP0 Cause/BadVAddr/Status, uses
    # jalr with non-$ra link registers and a non-standard stack. ultramodern owns exceptions.
    "func_800071D0",
    "func_8000777C",
    "func_100077B8",
    "func_80007C74",
    "func_10007CC4",
    "func_80007DAC",
    # Rare's handwritten software geometry code (0x150A3A70:0x150AE35C) is recompiled as a shared
    # code region (see `regions` in us.syms.toml), not stubbed.
]

# The audio frame builder (func_800095A0, src/done/main/init_8F90.c) reads AI_LEN directly
# (`lui $t6, 0xA450; lw $v1, 4($t6)`) to choose this frame's sample count. The RCP registers are
# plain memory in the recomp, so replace the loaded value with the runtime's osAiGetLength (the
# bytes still queued for playback), as libultra's osAiGetLength would return on hardware.
[[patches.hook]]
func = "func_800095A0"
before_vram = 0x100095D4
text = "{ void osAiGetLength_recomp(uint8_t*, recomp_context*); uint64_t saved_v0 = ctx->r2; osAiGetLength_recomp(rdram, ctx); ctx->r3 = ctx->r2; ctx->r2 = saved_v0; }"
