# N64Recomp configuration for Conker's Bad Fur Day (US, NFUE, SHA-1 4cbadd3c4e0729dec46af64ad018050eada4f47a).
#
# Run from the repository root:
#   build/N64Recomp/N64Recomp config/us.toml
#
# `us.syms.toml` and the virtual ROM are generated by tools/gen_syms.py from the decomp
# inventory. Sections are described at their runtime (TLB) addresses: main at 0x10001000,
# game overlay at 0x15000000, debugger overlay at 0x16000000. See docs/memory-layout.md.

[input]
# No `entrypoint`: N64Recomp would recompile the handwritten boot stub at ROM 0x1000, which
# only clears bss, sets $sp and jumps to the TLB setup routine. The runtime's native entry
# function performs that work itself and then calls func_80001050, the first C function.
symbols_file_path = "us.syms.toml"
rom_file_path = "../build/us/conker.us.recomp.bin"
output_func_path = "../build/us/RecompiledFuncs"
functions_per_output_file = 50
# Declarations for the runtime-provided functions that funcs.h does not declare (see
# tools/gen_extras_decl.py and src/runtime/ultra_extras.cpp).
recomp_include = "#include \"recomp.h\"\n#include \"conker_extras_decl.h\"\n#include \"fixes/geometry_escape.h\""
# Emit TRACE_ENTRY()/TRACE_RETURN() in every function, and #include "trace.h" for them;
# src/runtime/trace.h turns them into a per-thread ring buffer of recent calls that the crash
# reporter prints (compile with -DCONKER_TRACE=1).
trace_mode = true

[patches]
# Functions that must not be recompiled because they touch CP0, the TLB or the exception
# vector. The runtime (N64ModernRuntime) provides the OS layer natively.
ignored = [
    # Rare's raw PI DMA for small transfers: polls PI_STATUS and programs the PI registers directly
    # (src/main/init_4470.c). Replaced by a native ROM copy in src/runtime/ultra_extras.cpp.
    "func_8000480C",
    # libultra's osContInit (main and game-overlay copies, named in tools/gen_syms.py). Native in
    # src/runtime/ultra_extras.cpp: the runtime's osContInit plus the __osEepromTimerQ it leaves
    # out.
    "conker_osContInit",
    "conker_osContInit_game",
    # Rare's rumble pak routines (src/main/init_5570.c, src/main/init_57E0.c): motor init, which
    # probes the pak through __osContRamWrite/Read, and the stop and start packets it prebuilds.
    # Native in src/runtime/ultra_extras.cpp, where the pak is the host pad's rumble.
    "func_800057E0",
    "func_80005570",
    "func_800056A0",
]

# Functions compiled to empty bodies (a `return` with no effect on state).
stubs = [
    # Handwritten CP0/TLB routines: boot TLB alias install (0x5AB0), demand-paging allocator setup (0x5B04),
    # TLB-miss page loader (0x5C2C), TLB index invalidation (0x61F8) and the debugger's TLB helper.
    # The runtime keeps the whole game image resident, so there is nothing to page.
    "func_80005AB0",
    "func_80005B04",
    "func_80005C2C",
    "func_800061F8",
    # Page-pool bitmap initialiser: walks the bitmap that func_80005B04 would have allocated.
    "func_80005BE0",
    "func_16003650",
    # Exception/interrupt handling family (0x71D0:0x8120): reads CP0 Cause/BadVAddr/Status, uses
    # jalr with non-$ra link registers and a non-standard stack. ultramodern owns exceptions.
    "func_800071D0",
    "func_8000777C",
    "func_100077B8",
    "func_80007C74",
    "func_10007CC4",
    "func_80007DAC",
    # Rare's handwritten software geometry code (0x150A3A70:0x150AE35C) is recompiled as a shared
    # code region (see `regions` in us.syms.toml), not stubbed.
]

# The audio frame builder (func_800095A0, src/done/main/init_8F90.c) reads AI_LEN directly
# (`lui $t6, 0xA450; lw $v1, 4($t6)`) to choose this frame's sample count. The RCP registers are
# plain memory in the recomp, so replace the loaded value with the runtime's osAiGetLength (the
# bytes still queued for playback), as libultra's osAiGetLength would return on hardware.
[[patches.hook]]
func = "func_800095A0"
before_vram = 0x100095D4
text = "{ void osAiGetLength_recomp(uint8_t*, recomp_context*); uint64_t saved_v0 = ctx->r2; osAiGetLength_recomp(rdram, ctx); ctx->r3 = ctx->r2; ctx->r2 = saved_v0; }"

# func_8000853C returns a sequence player's state to the music manager, which frees the record of
# a player it sees stopped. A sequence that was started this frame is still stopped until the
# audio thread's next render, which on hardware always comes first; the recompiled game can get
# there sooner and drop the title music. See conker_seqp_state_hook in src/fixes/music_start.cpp.
[[patches.hook]]
func = "func_8000853C"
before_vram = 0x10008560
text = "{ void conker_seqp_state_hook(uint8_t*, recomp_context*); conker_seqp_state_hook(rdram, ctx); }"

# L skips from the boot logos or the intro (scene 0x21, Conker sawing the N64 logo) straight to
# the title menu, as it skips cutscenes. On hardware Start only skips the intro after a warm reset
# and after 301 ticks, and the title scene's opening (scene 0x1D script 1) needs a press of its
# own. One press fades the screen to black (drawn by func_1517F3A0), and behind it the logo timer
# in func_151DE6D4 jumps to its end, the skip check func_1501E05C passes for the intro, and it sets
# the title scene's skip flag, with func_1501E1B4's hidden 30-tick fades cut to one tick. Then it
# fades in on the menu. See conker_*_skip in src/enhancements/intro_skip/intro_skip.cpp;
# CONKER_SKIP_INTRO=1 skips without a press, =0 turns it off.
[[patches.hook]]
func = "func_151DE6D4"
before_vram = 0x151DE728
text = "{ void conker_logo_skip(uint8_t*, recomp_context*); conker_logo_skip(rdram, ctx); }"

[[patches.hook]]
func = "func_1501E05C"
before_vram = 0x1501E080
text = "{ void conker_title_skip(uint8_t*, recomp_context*); conker_title_skip(rdram, ctx); }"

[[patches.hook]]
func = "func_1501E05C"
before_vram = 0x1501E0C8
text = "{ extern int conker_intro_skip_now; void conker_intro_skip(uint8_t*, recomp_context*); conker_intro_skip(rdram, ctx); if (conker_intro_skip_now) { ctx->r2 = 1; goto L_1501E1A4; } }"

[[patches.hook]]
func = "func_1501E1B4"
before_vram = 0x1501E244
text = "{ void conker_skip_fade_wait(uint8_t*, recomp_context*); conker_skip_fade_wait(rdram, ctx); }"

[[patches.hook]]
func = "func_1517F3A0"
before_vram = 0x1517F3C0
text = "{ void conker_skip_fade_alpha(uint8_t*, recomp_context*); conker_skip_fade_alpha(rdram, ctx); }"

[[patches.hook]]
func = "func_1517F3A0"
before_vram = 0x1517F3F4
text = "{ void conker_skip_fade_colour(uint8_t*, recomp_context*); conker_skip_fade_colour(rdram, ctx); }"

# Rare's geometry code escapes from deep inside its work: func_150ADAF0 saves its $sp in D_800D3858,
# and func_150AE280 restores it and returns from func_150ADAF0 to its caller, past the recompiled C
# frames in between (func_1509C7C8, func_1509F850, ...). Done as setjmp/longjmp; see
# src/fixes/geometry_escape.h. The region's body is emitted with func_150A3A70, so its hooks go
# there. Without this the first area after the opening crashed ("Failed to find function at
# 0x00000002").
[[patches.hook]]
func = "func_150A3A70"
before_vram = 0x150ADAFC
text = "if (CONKER_SETJMP(*conker_geometry_escape_arm(ctx)) != 0) { goto L_150AE0AC; }"

[[patches.hook]]
func = "func_150A3A70"
before_vram = 0x150AE0AC
text = "conker_geometry_escape_disarm(rdram, ctx);"

[[patches.hook]]
func = "func_150A3A70"
before_vram = 0x150AE280
text = "conker_geometry_escape(rdram, ctx);"

