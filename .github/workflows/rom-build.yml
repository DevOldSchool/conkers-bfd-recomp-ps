# Builds the game from the ROM and runs the regression cases (tests/regress), on pushes to main and
# by hand. The ROM and the regression reports come from the private conkers-bfd-assets repository
# through a read-only deploy key, which only the `rom` environment holds; that environment takes
# main and v* tags only, so pull requests (forks included) never reach it.
#
# Nothing made from the ROM leaves the runner: no artifacts, no caches (a pull request can read the
# base branch's caches), and only the regression summary, which is the cases' own text, goes into
# the job summary.
name: ROM build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rom-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The decomp revision tools/regenerate.sh reads (game code extraction and the virtual ROM). The
  # symbols are committed (config/us.syms.toml), so a newer decomp is taken on purpose, by changing
  # this, after checking that the regenerated code still builds and passes.
  DECOMP_REF: 38f3c3348cf5dbeeb0a0b191f3f4576c85a97bc7
  CC: clang
  CXX: clang++

jobs:
  build:
    name: Build from the ROM, regression cases
    runs-on: ubuntu-24.04
    environment: rom
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: recomp

      # What the headless build and the patches need: rt64's other submodules are large and unused.
      - name: Check out submodules
        working-directory: recomp
        run: |
          git submodule update --init --recursive lib/N64ModernRuntime lib/N64Recomp
          git submodule update --init --depth 1 lib/rt64
          git -C lib/rt64 submodule update --init --depth 1 src/contrib/plume

      - uses: actions/checkout@v4
        with:
          repository: DevOldSchool/conkers-bfd-decomp
          ref: ${{ env.DECOMP_REF }}
          path: decomp

      # Only the US ROM and the regression reports, not the other dumps.
      - uses: actions/checkout@v4
        with:
          repository: DevOldSchool/conkers-bfd-assets
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: assets
          sparse-checkout: |
            baserom.us.z64
            regress
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang ninja-build

      - name: Apply patches
        working-directory: recomp
        run: tools/apply_patches.sh

      - name: Regenerate the code from the ROM
        working-directory: recomp
        env:
          CONKER_DECOMP: ${{ github.workspace }}/decomp
          CONKER_ROM: ${{ github.workspace }}/assets/baserom.us.z64
        run: tools/regenerate.sh

      - name: Build (headless)
        working-directory: recomp
        run: |
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCONKER_RENDERER=null
          cmake --build build/host

      - name: Regression cases
        working-directory: recomp
        env:
          CONKER_ROM: ${{ github.workspace }}/assets/baserom.us.z64
          CONKER_REGRESS_DATA: ${{ github.workspace }}/assets/regress
        run: python3 tools/regress.py --jobs 4

      - name: Summary
        if: always()
        working-directory: recomp
        run: |
          if [ -f build/regress/summary.md ]; then cat build/regress/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
