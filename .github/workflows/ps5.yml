# Builds the PS5 title from the ROM and packages it, on pushes to main, by hand, and on a version tag
# (00.001.000, the title's contentVersion), where it makes a draft release for a person to check and
# publish. The desktop builds and releases are the main project's (conkers-bfd-recomp); this
# repository builds only the PS5 title.
#
# The ROM comes from a private repository through a read-only deploy key, as in the main project: the
# `rom` environment holds the key and where the ROM is (ASSETS_REPO, ASSETS_ROM, ASSETS_DEPLOY_KEY)
# and takes main and version tags only, so pull requests (forks included) never reach it. The
# recompiled code is made from the ROM, so it is never cached or passed on: the dependency and build
# volumes live and die with the runner. Only the packages leave it, and they carry no ROM.
name: PS5

on:
  push:
    branches: [main]
    tags: ['[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ps5-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # The decomp revision tools/regenerate.sh reads; the main project's release.yml names the same one.
  DECOMP_REF: 38f3c3348cf5dbeeb0a0b191f3f4576c85a97bc7

jobs:
  build:
    name: Build the PS5 title
    runs-on: ubuntu-24.04
    environment: rom
    # The first build of RADV and the game together takes the longest.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          path: recomp
          fetch-depth: 0
          submodules: recursive

      # The build image, RADV's build and the game's take more room than the runner leaves free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang ninja-build zip

      - uses: ./recomp/.github/actions/regenerate
        with:
          decomp-ref: ${{ env.DECOMP_REF }}
          assets-repo: ${{ secrets.ASSETS_REPO }}
          assets-rom: ${{ secrets.ASSETS_ROM }}
          deploy-key: ${{ secrets.ASSETS_DEPLOY_KEY }}

      # The console shows contentVersion as the title's version, and the catalog takes the tag for it.
      - name: Check the tag against param.json
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: recomp
        run: |
          content="$(python3 -c 'import json; print(json.load(open("tools/ps5/sce_sys/param.json"))["contentVersion"])')"
          if [ "$content" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not param.json's contentVersion $content"
            exit 1
          fi

      - name: Build
        working-directory: recomp
        run: tools/ps5/build.sh all

      # The title folder, PPSA92064/ at the zip's top (what the catalog and an FTP copy want), and the
      # unsigned program with its symbols, for reading a crash report's addresses.
      - name: Package
        working-directory: recomp
        run: |
          version="$(tools/version.sh)"
          name="Conkers-Bad-Fur-Day-Recompiled-PS5-$version"
          mkdir -p packages
          (cd dist && zip -qrX "../packages/$name.zip" PPSA92064)
          docker run --rm -v conker-ps5-build:/b -v "$PWD/packages:/out" ubuntu:24.04 \
            cp /b/ConkersBadFurDayRecompiled.elf /out/ConkersBadFurDayRecompiled-PS5.elf
          (cd packages && zip -qmX "$name-symbols.zip" ConkersBadFurDayRecompiled-PS5.elf)
          (cd packages && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: ps5
          path: recomp/packages/*
          retention-days: 3
          if-no-files-found: error

  # The complete source the GPL-3.0 asks for, whatever happens to the repositories it comes from:
  # this repository with its submodules (tools/source_archive.sh), and the PS5 libraries the build
  # fetches (Mihawk's PS5_Vulkan, PS5_Mesa and PS5_PayloadSDK) at the revisions tools/ps5/build.sh pins.
  source:
    name: Source archives
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: recomp
          fetch-depth: 0
          submodules: recursive
      - name: Archive
        working-directory: recomp
        run: |
          tools/source_archive.sh
          eval "$(grep -E '^ps5_(vulkan|mesa|sdk)_(url|rev)=' tools/ps5/build.sh)"
          mkdir -p "$RUNNER_TEMP/ps5-deps"
          for pair in "$ps5_vulkan_url $ps5_vulkan_rev" "$ps5_mesa_url $ps5_mesa_rev" "$ps5_sdk_url $ps5_sdk_rev"; do
            read -r url rev <<< "$pair"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/ps5-deps/$(basename "$url" .git)-$rev.tar.gz" "${url%.git}/archive/$rev.tar.gz"
          done
          tar -czf "dist/Conkers-Bad-Fur-Day-Recompiled-PS5-$(tools/version.sh)-dependencies-source.tar.gz" \
            -C "$RUNNER_TEMP" ps5-deps
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: recomp/dist/*.tar.gz
          retention-days: 3
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l packages
          gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
