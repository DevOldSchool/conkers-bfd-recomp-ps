# Builds and packages the game for every platform, and on a v* tag makes a draft release with them
# for a person to check and publish. Run by hand, it only builds: the packages are the run's
# artifacts, kept for 3 days. The debug information (dSYM, .pdb) is never released: it stays with
# the run as the debug-* artifacts, for 90 days.
#
# Every job regenerates the code from the ROM itself (.github/actions/regenerate): the recompiled
# code is made from the ROM, so it is never passed between jobs as an artifact or cached. Only the
# packages leave the runners, and they carry no ROM.
#
# The packaging is the repository's own scripts: tools/package_macos.sh, tools/linux/build.sh (in
# Docker) and tools/windows/cross_build.sh + package.sh (cross-compiled on Linux, the shaders by the
# Windows DXC under Wine).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DECOMP_REF: 38f3c3348cf5dbeeb0a0b191f3f4576c85a97bc7  # as in rom-build.yml
  LLVM_VERSION: 22
  XWIN_VERSION: 0.10.0
  SDL3_VERSION: 3.4.16
  SDL2_COMPAT_VERSION: 2.32.72
  # What each download must be (its release's SHA-256, as GitHub lists it; change with the version):
  # they are built into the game or run in the jobs that are then given the ROM.
  XWIN_SHA256: d870eb4b2f390878af6da1ccd3cf321d22fcb72720984853b4be732ae597fc88
  SDL3_SHA256: 7322236cd12090c3eb40b9728be4d49c76f66ad17d04369584d4ecad5cf77c68
  SDL2_COMPAT_SHA256: a14d2f78dad8e83ef1039b6534ace4d14f11f5b11d023af989affd70ac1bb35e
  # apt.llvm.org's llvm.sh as of this commit of its repository (opencollab/llvm-jenkins.debian.net).
  LLVM_SH_COMMIT: 076c86e05ebae0ab66edeecd2f0f438ae15de0bb
  MACOS_TARGET: '14.0'

jobs:
  macos:
    # Forks have no ROM secrets: skip there instead of failing.
    if: github.repository == 'DevOldSchool/conkers-bfd-recomp'
    name: macOS (Apple silicon)
    runs-on: macos-15
    environment: rom
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          path: recomp
          fetch-depth: 0
          submodules: recursive

      - name: Install tools
        run: brew install ninja llvm lld

      - uses: ./recomp/.github/actions/regenerate
        with:
          decomp-ref: ${{ env.DECOMP_REF }}
          assets-repo: ${{ secrets.ASSETS_REPO }}
          assets-rom: ${{ secrets.ASSETS_ROM }}
          deploy-key: ${{ secrets.ASSETS_DEPLOY_KEY }}

      # Homebrew's SDL needs the macOS it was built on; the app carries one built for MACOS_TARGET.
      - name: Build SDL for macOS ${{ env.MACOS_TARGET }}
        run: |
          mkdir -p sdl && cd sdl
          curl -fsSLO "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3_VERSION/SDL3-$SDL3_VERSION.tar.gz"
          curl -fsSLO "https://github.com/libsdl-org/sdl2-compat/releases/download/release-$SDL2_COMPAT_VERSION/sdl2-compat-$SDL2_COMPAT_VERSION.tar.gz"
          printf '%s  %s\n' "$SDL3_SHA256" "SDL3-$SDL3_VERSION.tar.gz" "$SDL2_COMPAT_SHA256" "sdl2-compat-$SDL2_COMPAT_VERSION.tar.gz" \
            | shasum -a 256 -c -
          tar -xzf "SDL3-$SDL3_VERSION.tar.gz"
          tar -xzf "sdl2-compat-$SDL2_COMPAT_VERSION.tar.gz"
          cmake -S "SDL3-$SDL3_VERSION" -B build/sdl3 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_TARGET" -DCMAKE_INSTALL_PREFIX="$PWD/prefix" -DSDL_TESTS=OFF
          cmake --build build/sdl3 && cmake --install build/sdl3
          cmake -S "sdl2-compat-$SDL2_COMPAT_VERSION" -B build/sdl2c -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_TARGET" -DCMAKE_INSTALL_PREFIX="$PWD/prefix" \
            -DCMAKE_PREFIX_PATH="$PWD/prefix" -DSDL2COMPAT_TESTS=OFF
          cmake --build build/sdl2c && cmake --install build/sdl2c

      - name: Build
        working-directory: recomp
        run: |
          tools/build_mods.sh
          map="-ffile-prefix-map=$GITHUB_WORKSPACE=."
          cmake -S . -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCONKER_RENDERER=rt64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_TARGET" -DSDL2_DIR="$GITHUB_WORKSPACE/sdl/prefix/lib/cmake/SDL2" \
            -DCMAKE_C_FLAGS="$map" -DCMAKE_CXX_FLAGS="$map" -DCMAKE_OBJC_FLAGS="$map" -DCMAKE_OBJCXX_FLAGS="$map"
          cmake --build build/macos

      - name: Package
        working-directory: recomp
        run: |
          tools/package_macos.sh build/macos
          version="$(tools/version.sh)"
          (cd dist && ditto -c -k --keepParent ConkersBadFurDayRecompiled.dSYM "Conkers-Bad-Fur-Day-Recompiled-$version-macos-dsym.zip")

      - uses: actions/upload-artifact@v7
        with:
          name: package-macos
          path: |
            recomp/dist/*.zip
            !recomp/dist/*-dsym.zip
          retention-days: 3
          if-no-files-found: error

      # The debug information stays with the run, for collaborators only: never in the release.
      - uses: actions/upload-artifact@v7
        with:
          name: debug-macos
          path: recomp/dist/*-dsym.zip
          retention-days: 90
          if-no-files-found: error

  linux:
    # Forks have no ROM secrets: skip there instead of failing.
    if: github.repository == 'DevOldSchool/conkers-bfd-recomp'
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    environment: rom
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # GitHub's arm64 Linux runners are for public repositories only: while this one is private,
        # only x64 is built.
        include: ${{ fromJSON(github.event.repository.private
          && '[{"arch":"x64","runner":"ubuntu-24.04"}]'
          || '[{"arch":"x64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: recomp
          fetch-depth: 0
          submodules: recursive

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld ninja-build

      - uses: ./recomp/.github/actions/regenerate
        with:
          decomp-ref: ${{ env.DECOMP_REF }}
          assets-repo: ${{ secrets.ASSETS_REPO }}
          assets-rom: ${{ secrets.ASSETS_ROM }}
          deploy-key: ${{ secrets.ASSETS_DEPLOY_KEY }}

      # Builds the speedrun mod on the runner, then the game in an Ubuntu 24.04 container, and packages it.
      - name: Build and package
        working-directory: recomp
        run: tools/linux/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: package-linux-${{ matrix.arch }}
          path: recomp/dist/*.tar.gz
          retention-days: 3
          if-no-files-found: error

  windows:
    # Forks have no ROM secrets: skip there instead of failing.
    if: github.repository == 'DevOldSchool/conkers-bfd-recomp'
    name: Windows (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    environment: rom
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          path: recomp
          fetch-depth: 0
          submodules: recursive

      # clang-cl for the MSVC headers xwin brings (they want a recent clang), and xwin itself.
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build zip
          curl -fsSL "https://raw.githubusercontent.com/opencollab/llvm-jenkins.debian.net/$LLVM_SH_COMMIT/llvm.sh" -o llvm.sh
          sudo bash llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends "llvm-$LLVM_VERSION" "lld-$LLVM_VERSION" "clang-tools-$LLVM_VERSION"
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"
          curl -fsSLO "https://github.com/Jake-Shadle/xwin/releases/download/$XWIN_VERSION/xwin-$XWIN_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$XWIN_SHA256  xwin-$XWIN_VERSION-x86_64-unknown-linux-musl.tar.gz" | sha256sum -c -
          tar -xzf "xwin-$XWIN_VERSION-x86_64-unknown-linux-musl.tar.gz" --strip-components=1 -C /usr/local/bin \
            "xwin-$XWIN_VERSION-x86_64-unknown-linux-musl/xwin"

      - uses: ./recomp/.github/actions/regenerate
        with:
          decomp-ref: ${{ env.DECOMP_REF }}
          assets-repo: ${{ secrets.ASSETS_REPO }}
          assets-rom: ${{ secrets.ASSETS_ROM }}
          deploy-key: ${{ secrets.ASSETS_DEPLOY_KEY }}

      # XWIN_ACCEPT_LICENSE=1 accepts Microsoft's license for the MSVC CRT and Windows SDK it downloads.
      - name: Build
        working-directory: recomp
        env:
          LLVM_DIR: /usr/lib/llvm-${{ env.LLVM_VERSION }}/bin
          XWIN_ACCEPT_LICENSE: 1
        run: tools/windows/cross_build.sh rt64 ${{ matrix.arch }}

      - name: Package
        working-directory: recomp
        run: tools/windows/package.sh build/windows-rt64${{ matrix.arch == 'arm64' && '-arm64' || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: package-windows-${{ matrix.arch }}
          path: |
            recomp/dist/*.zip
            !recomp/dist/*-pdb.zip
          retention-days: 3
          if-no-files-found: error

      # The debug information stays with the run, for collaborators only: never in the release.
      - uses: actions/upload-artifact@v7
        with:
          name: debug-windows-${{ matrix.arch }}
          path: recomp/dist/*-pdb.zip
          retention-days: 90
          if-no-files-found: error

  source:
    name: Source archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: recomp
          fetch-depth: 0
          submodules: recursive
      - name: Archive
        working-directory: recomp
        run: tools/source_archive.sh
      - uses: actions/upload-artifact@v7
        with:
          name: package-source
          path: recomp/dist/*.tar.gz
          retention-days: 3
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          pattern: package-*
          merge-multiple: true
      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l packages
          gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
