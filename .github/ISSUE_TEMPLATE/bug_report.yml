name: Bug report
description: Something in the game looks, sounds or plays wrong, crashes or freezes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The quickest issue to fix is one that comes with a **debug report**: it
        holds a save of the game at the moment you made it, so the problem can be loaded and seen in
        a few seconds.

        **Saving a debug report**

        1. When the problem is on screen (or just after), open the debug menu: **View** on an Xbox
           pad, **Create** (Share) on a PlayStation pad, or the **`` ` ``** key on the keyboard.
        2. Choose **SAVE DEBUG REPORT** and press A.
        3. Close the game, then open the `conker-recomp-data/debug_reports/` folder. It is in the
           folder you started the game from. The report is the folder named after the scene and
           the time, for example `scene12-20261022-191043`.
        4. Zip that folder and drag the zip into the box below.

        A report has the build, the scene, Conker's position, the camera, your settings and
        enhancements, a summary of the computer (operating system, CPU, GPU, memory, display size;
        nothing that names you or the computer) and a copy of the save at that moment. Your own save
        is not changed. Read `report.json` before attaching if you want to see exactly what is in it.

        If the game **froze**, the same folder may also have a `hang-<date>-<time>.txt`: attach
        that too. If it **crashed**, there is no report, but the terminal it was started from
        prints what failed: paste that output below.

        **Never attach or link a ROM**, or anything made from one. Issues that do are closed.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you post
      options:
        - label: I searched the existing issues and this is not already reported.
          required: true
        - label: I have not attached or linked a ROM.
          required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw or heard, and what you expected instead.
      placeholder: The sunflower in Windy flickers black when the camera turns towards the barn.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps from loading the save (or a debug report) to the problem.
      placeholder: |
        1. Load the report below.
        2. Walk forward to the barn door.
        3. Turn the camera left.

  - type: textarea
    id: debug_report
    attributes:
      label: Debug report
      description: Drag the zipped report folder here (and any `hang-*.txt`). Screenshots and videos are welcome too.
      placeholder: Drop scene12-20261022-191043.zip here

  - type: textarea
    id: location
    attributes:
      label: Where in the game
      description: |
        Needed when you cannot attach a report. The chapter and area, what you were doing, and, if you
        can, the line SHOW POSITION in the debug menu puts on screen (scene, X, Y, Z, facing).
      placeholder: "Chapter 1, Windy, by the barn, just after talking to Birdy. Scene 12, X 1520 Y 40 Z -880, facing 92."

  - type: dropdown
    id: frequency
    attributes:
      label: How often
      options:
        - Every time
        - Often
        - Once or rarely
    validations:
      required: true

  - type: dropdown
    id: enhancements
    attributes:
      label: With the enhancements off
      description: In the debug menu, ENHANCEMENTS switches each one off. Does the problem still happen?
      options:
        - Not tried
        - Still happens with them off
        - Goes away with one off (say which below)
    validations:
      required: true

  - type: dropdown
    id: original
    attributes:
      label: On the original game
      description: Some oddities are Rare's own. Does it happen on a console or an accurate emulator?
      options:
        - Not tried
        - No, only here
        - Yes, the original does it too

  - type: input
    id: build
    attributes:
      label: Build
      description: The release, or the `build` line in the report's `report.json` (or `git describe` if you built it).
      placeholder: v0.1.0 or 6360a83
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Steam Deck
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: Computer and controller
      description: Not needed when a report is attached. GPU, graphics API if you know it, and the controller.
      placeholder: Apple silicon, Metal, DualSense over Bluetooth

  - type: textarea
    id: log
    attributes:
      label: Terminal output
      description: For crashes, freezes and anything the game printed around the problem.
      render: shell
